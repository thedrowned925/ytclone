name: YTClone CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install web dependencies
        run: npm install
      - name: Build Android-first web app
        run: npm run build
      - name: Syntax-check local uploader engine
        run: |
          node --check uploader/src/index.mjs
          node --check uploader/src/commands.mjs
          node --check uploader/src/pipeline.mjs
          node --check uploader/src/github.mjs
      - name: Syntax-check trusted API
        run: |
          node --check server/src/index.mjs
          node --check server/src/chunked-release.mjs

# Important: CI intentionally does NOT download videos, run FFmpeg transcodes,
# or upload media. Heavy media work belongs to the owner's local YTClone Uploader.
