name: YTClone Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore stable Android signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ytclone-android-signing-v1-${{ runner.os }}

      - name: Create signing key when missing
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=YTClone Android Update,O=YTClone,C=TR"
          fi
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -E "SHA256:|Valid from" || true

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android 36 platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTClone-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cp android/app/build/outputs/apk/debug/app-debug.apk YTClone-0.1.1-debug.apk

      - name: Publish GitHub Release v0.1.1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.1 >/dev/null 2>&1; then
            gh release upload v0.1.1 YTClone-0.1.1-debug.apk --clobber
          else
            gh release create v0.1.1 YTClone-0.1.1-debug.apk \
              --title "YTClone v0.1.1 - Android Progress Test" \
              --notes "Android arşivleme ekranına canlı indirme/işleme/chunk/upload ilerlemesi eklendi. Son iş, GitHub repo/token ayarları ve ingest tercihleri uygulama güncellemelerinde korunur. Bu sürümden itibaren CI sabit bir Android imza anahtarı kullanır. v0.1.0 geçici CI debug anahtarıyla imzalandığı için v0.1.0'dan bu sürüme geçişte bir defalık kaldırıp yeniden kurma gerekebilir."
          fi

      - name: Record successful release publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          printf '# Android Release Status\n\n- Release: v0.1.1\n- Asset: YTClone-0.1.1-debug.apk\n- Status: published successfully\n- Source commit: %s\n' "$GITHUB_SHA" > RELEASE-STATUS.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RELEASE-STATUS.md
          git diff --cached --quiet || git commit -m "chore: record v0.1.1 release publication [skip ci]"
          git push
