name: YTClone Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Restore stable Android signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ytclone-android-signing-v1-${{ runner.os }}
      - name: Create signing key when missing
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            if [ -f "SIGNING-V1-INITIALIZED" ]; then
              echo "::error::YTClone stable signing key cache is missing. Refusing to create a different key because Android updates would lose signature compatibility."
              exit 1
            fi
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=YTClone Android Update,O=YTClone,C=TR"
          fi
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Android 36 platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --stacktrace
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTClone-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Prepare release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cp android/app/build/outputs/apk/debug/app-debug.apk YTClone-0.1.8-debug.apk
      - name: Publish GitHub Release v0.1.8
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.8 >/dev/null 2>&1; then
            gh release upload v0.1.8 YTClone-0.1.8-debug.apk --clobber
          else
            gh release create v0.1.8 YTClone-0.1.8-debug.apk \
              --title "YTClone v0.1.8 - Player Seek & Back Navigation" \
              --notes "Playbar/seek akışı yeniden düzenlendi. Video süresi Media3 henüz timeline vermediğinde katalog metadata süresinden alınır; scrub sırasında geçici 0ms değerleri hedef pozisyonu ezmez. PlaybackManager pending seek hedefini video bazında saklar ve READY/seekable timeline oluşunca tekrar uygular; kalite/ses/al­tyazı source switch aynı hedef milisaniyeyi korur. Player yerleşimi YouTube'a daha yakın hale getirildi: üst kontroller, orta 10sn geri/oynat/10sn ileri, altta zaman/tam ekran ve en dipte kırmızı playbar. Android sistem geri tuşu artık player, kanal, playlist, arama, ayarlar ve sekmeler arasında geri gider; yalnız ana sayfada uygulamadan çıkar. v0.1.7 ile aynı Android imzasını kullanır."
          fi
      - name: Record successful release publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          printf '# Android Release Status\n\n- Release: v0.1.8\n- Asset: YTClone-0.1.8-debug.apk\n- Status: published successfully\n- Source commit: %s\n' "$GITHUB_SHA" > RELEASE-STATUS.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RELEASE-STATUS.md
          git diff --cached --quiet || git commit -m "chore: record v0.1.8 release publication [skip ci]"
          git push
