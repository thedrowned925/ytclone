name: YTClone Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Restore stable Android signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ytclone-android-signing-v1-${{ runner.os }}
      - name: Create signing key when missing
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            if [ -f "SIGNING-V1-INITIALIZED" ]; then
              echo "::error::YTClone stable signing key cache is missing. Refusing to create a different key because Android updates would lose signature compatibility."
              exit 1
            fi
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=YTClone Android Update,O=YTClone,C=TR"
          fi
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Android 36 platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --stacktrace
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTClone-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Prepare release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cp android/app/build/outputs/apk/debug/app-debug.apk YTClone-0.2.0-debug.apk
      - name: Publish GitHub Release v0.2.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.0 >/dev/null 2>&1; then
            gh release upload v0.2.0 YTClone-0.2.0-debug.apk --clobber
          else
            gh release create v0.2.0 YTClone-0.2.0-debug.apk \
              --title "YTClone v0.2.0 - Seekable GitHub Streaming" \
              --notes "Fixes the root cause of seek/playbar and quality/audio/subtitle switches restarting at 0. Newly archived YouTube adaptive streams are losslessly remuxed with the bundled FFmpeg into seek-friendly Matroska containers (video .mkv, audio .mka). There is no video/audio re-encoding and no quality loss; FFmpeg only rebuilds the container index/cues. Normal playback still streams from GitHub Release assets through byte-range requests and does not download the whole video to the device. Archive media schema is now v2, so re-submitting an older archived YouTube URL performs a one-time repair and updates the same ytclone-<videoId> Release instead of creating a duplicate. Uses the same stable Android signing key as previous releases."
          fi
      - name: Record successful release publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          printf '# Android Release Status\n\n- Release: v0.2.0\n- Asset: YTClone-0.2.0-debug.apk\n- Status: published successfully\n- Source commit: %s\n' "$GITHUB_SHA" > RELEASE-STATUS.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RELEASE-STATUS.md
          git diff --cached --quiet || git commit -m "chore: record v0.2.0 release publication [skip ci]"
          git push
